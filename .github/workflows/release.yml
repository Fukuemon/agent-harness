name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      e2e-released: ${{ steps.release.outputs['packages/e2e--release_created'] }}
      e2e-tag: ${{ steps.release.outputs['packages/e2e--tag_name'] }}
    steps:
      # GITHUB_TOKEN で作った PR と push では CI が動かないため、GitHub App のトークンを使う
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
      # release-please の yaml の updater はファイル全体を書き直すため、apm.lock.yaml は apm install で作り直す
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app.outputs.token }}
      - if: steps.release.outputs.prs_created == 'true'
        uses: jdx/mise-action@v4
      - if: steps.release.outputs.prs_created == 'true'
        run: apm install
      - if: steps.release.outputs.prs_created == 'true'
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          git diff --quiet -- apm.lock.yaml && exit 0
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$APP_SLUG[bot]@users.noreply.github.com"
          git add apm.lock.yaml
          git commit -m "chore: apm.lock.yaml のバージョンを更新する"
          git push

  # e2e のリリースができたときだけ、同じタグの kit を npm のレジストリへ trusted publishing で公開する
  publish-e2e-kit:
    needs: release-please
    # 信頼する発行元を npm に登録するまでは、リポジトリの変数 E2E_KIT_PUBLISH を置かず、公開しない。手順は CONTRIBUTING.md にある
    if: needs.release-please.outputs.e2e-released == 'true' && vars.E2E_KIT_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # id-token: write を持つジョブなので、actions は SHA で固定する
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.e2e-tag }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm check:kit
      # trusted publishing には npm CLI の 11.5.1 以上が要る。mise.toml の Node.js に付く npm が満たさなければ、公開の前に落とす
      - name: npm のバージョンを確認する
        run: |
          v=$(npm --version)
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$v" \
            || { echo "::error::trusted publishing には npm の 11.5.1 以上が要る。今の npm は $v"; exit 1; }
      - working-directory: packages/e2e/kit
        run: npm publish --access public

  # e2e をリリースしたのに公開を有効にしていないときは、kit が公開されていないことを知らせる
  warn-e2e-kit-unpublished:
    needs: release-please
    if: needs.release-please.outputs.e2e-released == 'true' && vars.E2E_KIT_PUBLISH != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TAG: ${{ needs.release-please.outputs.e2e-tag }}
        run: echo "::warning::$TAG をリリースしたが、変数 E2E_KIT_PUBLISH が true でないので kit を公開していない。CONTRIBUTING.md の「e2e の kit の公開」の手順で公開する"
