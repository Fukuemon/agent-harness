name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:text
      - run: pnpm lint:packages
      - run: pnpm test
      - run: pnpm check:index
      - run: pnpm check:project
      - run: pnpm check:history
      - run: pnpm check:links
      - run: pnpm list:drift
      - run: apm install
      - run: |
          git status --porcelain -- apm.lock.yaml .claude/settings.json .codex/hooks.json .claude/apm-hooks.json .codex/apm-hooks.json > drift.txt
          cat drift.txt
          git diff -- apm.lock.yaml .claude/settings.json .codex/hooks.json .claude/apm-hooks.json .codex/apm-hooks.json
          test ! -s drift.txt
