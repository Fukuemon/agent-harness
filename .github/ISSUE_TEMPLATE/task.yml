name: タスク
description: 要求を分解した実装の単位を起票する。親の要求の sub-issue にする
labels: [type:task]
body:
  - type: input
    id: parent
    attributes:
      label: 親の要求
      description: 分解した元の要求の issue 番号
      placeholder: "#12"
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 対応する設計
      description: 実装する Design Doc の節か、spec へのリンク
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 実施内容
      description: 何を作るか、何を変えるか。対象のファイルやパッケージ
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了の条件
      description: 確かめられる形の箇条書き。コマンドと期待する結果まで書く
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存
      description: 先に終わっている必要があるタスクの番号
