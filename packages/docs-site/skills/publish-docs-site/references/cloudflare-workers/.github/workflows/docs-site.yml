# 文書のサイトを組み立て、既定のブランチへ取り込んだら Cloudflare Workers へ公開し、Access の保護を確認する。
# pull request ごとのプレビューは出さない。プレビューは pull request のコードへ公開のトークンを渡すことになる。
# 文書の元はリポジトリの全体に散るので、変えたパスで絞らない。
#
# 前提
# - mise.toml に Node.js、pnpm、uv がある。docs-site/ は pnpm のワークスペースに入れ、ルートの開発の依存に yaml がある。
# - context/project.yml の docs_site.parts の build に、各 part を作るコマンドがある。
# - Secrets: CLOUDFLARE_API_TOKEN（1 つの Worker の Editor だけのトークン）
# - Variables: CLOUDFLARE_ACCOUNT_ID、DOCS_SITE_URL（公開先の URL）、DOCS_SITE_MARKER（トップのページにだけある文字列。認証の画面にも出るサイトの名前と Worker の名前は避ける）

name: 文書のサイト

on:
  push:
  workflow_dispatch:

concurrency:
  group: docs-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_SEND_TELEMETRY: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v4
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-docs-site.mjs --out docs-site/public --build

      - name: 公開する
        working-directory: docs-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm run build
          pnpm run deploy

      - name: 保護を確認する
        run: node scripts/check-docs-site-protection.mjs "${{ vars.DOCS_SITE_URL }}" "${{ vars.DOCS_SITE_MARKER }}"
