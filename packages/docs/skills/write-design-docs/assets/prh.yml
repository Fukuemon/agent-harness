# 文章の規則。どのプロジェクトでも成り立つものだけを置く。プロジェクトの用語の規則は、この下に足す
version: 1

rules:
  - expected: 名前で指す
    pattern: /\b(?!S3\b|M[1-4]\b|V8\b|D1\b|R2\b)(?:DQ|[GSMQRVD])\d{1,2}\b/
    prh: 記号の採番は使わない。記号だけでは、その文が単独で意味を持たない。名前や節の見出しで指す
  - expected: この文書に必要な事実だけを書く
    pattern: /(?:詳細|実現方法|調査結果|選定|結果|書式)は、?\s?(?:DesignDoc|Design Doc|PRD|ADR)(?:\.md)?\s?(?:に|で)(?:書|定め|記載)/
    prh: 「詳細は Design Doc に書く」のような案内文は書かない。内容は各文書の中で完結させる
  - expected: 日付を書かない
    pattern: /\d{4}\s?年(?!分|間|目|以上|後|前|ごと)(?:\s?\d{1,2}\s?月)?/
    prh: 文書に日付を書かない。履歴はコミットから読み取れる。バージョンなど、日付を使わずに時点を特定できる情報で書く
  - expected: 更新日を書かない
    pattern: /\bUpdated:/
    prh: 文書に更新日を書かない。履歴はコミットから読み取れる
  - expected: 次の $1 つ$2。
    pattern: /次の\s?(\d+)\s?つ(だけ)?である。/
    prh: 箇条書きや表を導く文は体言止めにする。「である」を重ねると不自然に読める
  - expected: 例は次の $1 つ。
    pattern: /次の\s?(\d+)\s?つが例である。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: 次のとおり。
    pattern: /次のとおりである。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: $1バージョン
    pattern: /(新しい|古い|最新の|最初の|次の|前の|同じ|別の|特定の|誤った|取り消した)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 新しい版を出す
        to: 新しいバージョンを出す
  - expected: バージョン
    pattern: /(?<!(?:語|\d\s?|[A-Za-z]\s?|無料|有料|体験|製品|完全|簡易|限定|特別|海外|国内|ベータ|デスクトップ|モバイル|スマホ))版(?=[をがはもにで]?(?:上げ|上が|下げ|戻|固定|指定|揃|そろ|ずれ|変え|書き換|宣言|定め|管理|置き場|所在|決め方|そのもの|更新))/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: 版を上げる
        to: バージョンを上げる
      - from: 日本語版を更新する
        to: 日本語版を更新する
      - from: Web 版を更新する
        to: Web 版を更新する
  - expected: $1$2バージョン
    pattern: /([A-Za-z0-9`]|ツール|パッケージ|プラグイン|ライブラリ|ランタイム|依存|schema)(\s?の\s?)版/
    prh: ソフトウェアの version はバージョンと書く。日本語版や第 2 版のような版は検出しない
    specs:
      - from: Node.js の版
        to: Node.js のバージョン
      - from: 日本語版の違い
        to: 日本語版の違い
      - from: ツールの版
        to: ツールのバージョン
