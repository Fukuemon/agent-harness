version: 1

rules:
  - expected: context
    patterns:
      - 知識文書
      - 知識の層
  - expected: spec
    pattern: 作業文書
  - expected: ガードレール
    pattern: 安全制約
  - expected: 自動チェック
    pattern: 検証手段
  - expected: モデルの弱さを補う指示
    pattern: 補助指示
  - expected: プロジェクト固有の知識
    pattern: 固有コンテキスト
  - expected: パッケージ
    patterns:
      - 共通資産
      - 配布物
  - expected: 利用者の環境
    pattern: 導入先
  - expected: 名前で指す
    pattern: /\b(?!S3\b|M[1-4]\b|V8\b|D1\b|R2\b)(?:DQ|[GSMQRVD])\d{1,2}\b/
    prh: 記号の採番は使わない。記号だけでは、その文が単独で意味を持たない。名前や節の見出しで指す
  - expected: この文書に必要な事実だけを書く
    pattern: /(?:詳細|実現方法|調査結果|選定|結果|書式)は、?\s?(?:DesignDoc|Design Doc|PRD|ADR)(?:\.md)?\s?(?:に|で)(?:書|定め|記載)/
    prh: 「詳細は Design Doc に書く」のような案内文は書かない。内容は各文書の中で完結させる
  - expected: サードパーティの拡張機能
    pattern: 外部の拡張
  - expected: サードパーティ
    pattern: サードパーティー
    prh: Claude Code の日本語の公式文書は、長音を付けずに書く
  - expected: スキル
    pattern: /(?<!Agent )\bSkill\b/
    prh: Claude Code の日本語の公式文書はカタカナで書く。仕様の名前の Agent Skills は英字のまま
  - expected: バージョン
    pattern: 版
    prh: Claude Code の日本語の公式文書と同じく、ソフトウェアの version はカタカナで書く
  - expected: プラグイン
    pattern: /(?<!Agent )\bPlugin\b/
    prh: Claude Code の日本語の公式文書はカタカナで書く。仕様の名前の Agent Plugins は英字のまま
  - expected: フック
    pattern: /\bHook\b/
    prh: Claude Code の日本語の公式文書はカタカナで書く
  - expected: 拡張機能
    pattern: /拡張(?=[のをはがにともや、。])/
    prh: スキル、プラグイン、フックなどをまとめて指すときは、Claude Code の日本語の公式文書に合わせて拡張機能と書く
  - expected: 日付を書かない
    pattern: /\d{4}\s?年(?!分|間|目|以上|後|前|ごと)(?:\s?\d{1,2}\s?月)?/
    prh: 文書に日付を書かない。履歴はコミットから読み取れる。バージョンなど、日付を使わずに時点を特定できる情報で書く
  - expected: 更新日を書かない
    pattern: /\bUpdated:/
    prh: 文書に更新日を書かない。履歴はコミットから読み取れる
  - expected: pull request
    patterns:
      - 変更の依頼
      - プルリクエスト
      - プル要求
    prh: GitHub の日本語の公式文書の見出しと同じ。表のセルと図の中だけ PR の略記を使う
  - expected: 次の $1 つ$2。
    pattern: /次の\s?(\d+)\s?つ(だけ)?である。/
    prh: 箇条書きや表を導く文は体言止めにする。「である」を重ねると不自然に読める
  - expected: 例は次の $1 つ。
    pattern: /次の\s?(\d+)\s?つが例である。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: 次のとおり。
    pattern: /次のとおりである。/
    prh: 箇条書きや表を導く文は体言止めにする
  - expected: 何をどう決めたかを書く
    pattern: /側に倒[さしすせそ]/
    prh: 判断を方向の比喩で書かない。「失敗したら処理を止める」のように、決めた動作を書く
    specs:
      - from: 安全側に倒す
        to: 安全何をどう決めたかを書く
  - expected: 起きることを書く
    patterns:
      - /引き返[さしすせそ]/
      - 収斂
      - 沈黙
    prh: 比喩の動詞を使わない。「元の状態に戻す」「エラーを出さずに終了する」のように、起きる操作や状態を書く
    specs:
      - from: 処理が沈黙する
        to: 処理が起きることを書くする
  - expected: 間違え
    pattern: 取り違え
    prh: 比喩の動詞を使わない
    specs:
      - from: 設定を取り違えた
        to: 設定を間違えた
  - expected: 比べた結果を書く
    patterns:
      - 主役
      - 別物
      - 桁違い
    prh: 評価を装う名詞を使わない。何がどう違うか、どれだけ違うかを書く
    specs:
      - from: 両者は別物である
        to: 両者は比べた結果を書くである
  - expected: 確かめた事実を書く
    patterns:
      - 手触り
      - 肌感
      - 温度感
      - 腹落ち
      - /解像度[をがの]?(?:上げ|上が|高)/
      - /本質(?:的)?/
    prh: 質感や理解を装う語を使わない。行った操作、読んだもの、測った値を書く
    specs:
      - from: 解像度を上げる
        to: 確かめた事実を書くる
  - expected: 具体的な出来事を書く
    patterns:
      - 真理
      - 境地
      - 美学
      - 深淵
      - 羅針盤
      - 起爆剤
    prh: 体験や判断を大げさな語で言わない
    specs:
      - from: 設計の美学
        to: 設計の具体的な出来事を書く
  - expected: 前置きを削る
    patterns:
      - /(?:まず|ここで)?重要なのは、?/
      - /結論から言うと、?/
      - /正直に言うと、?/
    prh: 前置きを書かず、言いたいことから書き始める
    specs:
      - from: 重要なのは、テストである
        to: 前置きを削るテストである
  - expected: 言い切る
    patterns:
      - /に他な(?:らない|らず|らぬ|らなかった|りません)/
      - /と言える(?:でしょう|だろう)/
    prh: 文末を飾らず、事実を言い切る
    specs:
      - from: 設定の誤りに他ならない
        to: 設定の誤り言い切る
      - from: 設定の誤りに他なりません
        to: 設定の誤り言い切る
  - expected: 結びの定型を削る
    patterns:
      - /いかがでした(?:でしょう)?か/
      - 参考になれば幸い
    prh: 読み手への形だけの呼びかけで結ばない
    specs:
      - from: いかがでしたか
        to: 結びの定型を削る
