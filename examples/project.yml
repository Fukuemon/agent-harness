version: 1

docs:
  design: design
  adr: adr
  spec: specs

guardrails:
  protected_branches:
    names: [main]
    direct_commit:
      allow: false
      reason: ""
  forbidden_commands: []
  secrets:
    enabled: true

process:
  defaults:
    processes: [requirements, design, implementation, verification-design, verification, integration, release]
    reflect_at: design
    breakdown_at: design
    review: [requirements, design, integration]
  additional: []
