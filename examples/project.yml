# プロジェクトごとの値。context/project.yml に置く。
# キーは読むパッケージごとにまとめる。パッケージを外したら、そのキーは要らない。
# 形は schemas/project.schema.json が定める。知らないキーは拒否しない。
version: 1

# 文書の体系（docs）が読む。文書のディレクトリ名
docs:
  design: design
  adr: adr
  spec: specs

# ガードレール（guardrails）が読む。規則ごとにキーを持ち、キーがない規則は無効
guardrails:
  protected_branches:
    names: [main]
    direct_commit:
      allow: false
      reason: ""
  forbidden_commands: []
  secrets:
    enabled: true

# 開発プロセス（process）が読む。要求ごとの選択の既定
process:
  defaults:
    processes: [requirements, design, implementation, verification-design, verification, integration, release]
    reflect_at: design
    breakdown_at: design
    review: [requirements, design, integration]
  additional: []
