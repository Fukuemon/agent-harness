commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    index:
      run: node packages/core/scripts/build-index.mjs --write && git add context/index.md
    lock:
      glob: ["packages/**", "skills/**", "apm.yml", "apm.lock.yaml"]
      run: mise x pipx:apm-cli -- apm install >/dev/null && git add apm.lock.yaml .claude/settings.json .codex/hooks.json .claude/apm-hooks.json .codex/apm-hooks.json
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}

# packages/global を直したら、この端末の user scope へ配置し直す
post-commit:
  commands:
    apply-global:
      run: node scripts/apply-global.mjs HEAD~1 HEAD

# 別の端末で直した変更を pull したときも、配置し直す
post-merge:
  commands:
    apply-global:
      run: node scripts/apply-global.mjs ORIG_HEAD HEAD
