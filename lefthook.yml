commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  commands:
    index:
      run: node packages/core/scripts/build-index.mjs --write && git add context/index.md
    lock:
      glob: ["packages/**", "skills/**", "apm.yml"]
      run: mise x pipx:apm-cli -- apm install >/dev/null && git add apm.lock.yaml
    textlint:
      glob: "*.md"
      run: pnpm exec textlint {staged_files}
